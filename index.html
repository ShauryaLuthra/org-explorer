<!doctype html> <!-- Tells the browser "this is modern HTML". -->
<html lang="en"> <!-- Start of the page; lang="en" tells screen readers the text is English. -->
  <head> <!-- Start of the invisible info about the page. -->
    <meta charset="UTF-8" /> <!-- Text encoding, so names with accents (e.g. "Zoë") display correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes phones use their real screen width; without it our responsive (phone) layout wouldn't kick in. -->
    <title>Org Explorer</title> <!-- The text shown on the browser tab. -->
  </head> <!-- End of the invisible info. -->
  <body> <!-- Start of the visible page. -->
    <div id="app"></div> <!-- An empty box. Vue will fill it with our whole app; main.js finds it by its id "app". -->
    <script type="module" src="/src/main.js"></script> <!-- Loads our starter file; type="module" allows import/export inside it. -->
  </body> <!-- End of the visible page. -->
</html> <!-- End of the page. -->
